[package]
name = "backend-rust-actix"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.11.0"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono"] }
tokio = { version = "1", features = ["full"] }
